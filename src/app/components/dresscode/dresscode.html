<app-novios />
<section class="sec-dresscode">
  <div scrollAnimate="fade-up" class="info-box">
    <h2 class="title">Código de Vestuario</h2>
    <h3 class="subtitle">Semi-Formal</h3>
  </div>
  <div scrollAnimate="zoom-in" [animDelay]="150" class="dress-grid">
    <div class="dress-item">
      <img src="assets/images/dama.webp" alt="Damas" loading="lazy" />
      <p class="dress-title">Damas</p>
    </div>
    <div class="dress-item">
      <img src="assets/images/caballero.webp" alt="Caballeros" loading="lazy" />
      <p class="dress-title">Caballeros</p>
    </div>
  </div>
  <div scrollAnimate="fade-up" [animDelay]="200" class="reserved-colors">
    <p class="title">Colores Reservados</p>
    <p class="subtitle">Blanco y Azul Oscuro</p>
    <p class="reserved-note">
      para uso exclusivo de la novia y damas de honor.
    </p>
    <div class="color-chips">
      <span class="chip chip--white" title="Blanco"></span>
      <span class="chip chip--dark" title="Azul Oscuro"></span>
    </div>
  </div>
</section>
