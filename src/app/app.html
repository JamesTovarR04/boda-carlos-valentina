<div class="app-wrapper">
  <!-- ── UI Global ──────────────────────────────────────── -->
  <app-intro-overlay
    [isOpen]="overlayOpen()"
    [isHidden]="overlayHidden()"
    (opened)="openDoors()"
  />

  <app-music-btn
    [active]="musicActive()"
    [visible]="showMusicBtn()"
    (toggled)="toggleMusic()"
  />

  <!-- ── Contenido principal ────────────────────────────── -->
  <main class="invitation-wrapper">
    <!-- Desktop: aviso solo-mobile -->
    <div class="desktop-notice">
      <p>
        Esta invitación ha sido optimizada para dispositivos móviles.<br />
        Ábrela desde tu celular o activa el modo móvil en tu navegador:<br />
        <strong>(clic derecho → 'Inspeccionar' → Ctrl + Shift + M)</strong>
      </p>
      <img src="assets/images/Movil.svg" alt="Abrir en móvil" width="80" />
    </div>

    <!-- 01 · Foto hero -->
    <app-hero />

    <app-container-bg>
      <!-- 02 · Nombres y mensaje -->
      <app-names />

      <!-- 03 · Padres -->
      <app-parents />

      <app-corazon />
    </app-container-bg>

    <!-- 04 · Tarjeta del invitado -->
    <app-guest-card guestName="Flia. Rodríguez Méndez" [spots]="4" />

    <!-- 05 · Countdown -->
    <app-countdown />

    <!-- ── Divisor + Foto ── -->
    <app-photo-section
      src="assets/images/foto_1.jpeg"
      alt="Foto de la pareja"
    />

    <app-container-bg>
      <!-- 06 · Ceremonia -->
      <app-ceremony />

      <!-- 07 · Recepción -->
      <app-reception />
    </app-container-bg>

    <!-- ──  Foto ── -->
    <app-photo-section
      src="assets/images/foto_5.jpeg"
      alt="Foto ceremonia"
      [showFlor]="true"
    />

    <app-container-bg>
      <!-- 08 · Código de vestuario -->
      <app-dresscode />

      <!-- 09 · Itinerario -->
      <app-itinerary />
    </app-container-bg>

    <!-- 10 · Notas -->
    <app-notes />

    <!-- ── Divisor + Foto ── -->
    <app-photo-section src="assets/images/foto_4.jpeg" alt="Foto novios" />

    <app-container-bg>
      <!-- 11 · Regalos -->
      <app-gifts />

      <app-video />

      <!-- 12 · Recuerdos / Álbum -->
      <app-memories />
    </app-container-bg>

    <app-container-bg>
      <!-- 13 · Agéndate -->
      <app-calendar />

      <!-- 14 · Confirmar asistencia -->
      <app-confirm />

      <!-- Footer -->
      <footer>
        <p>Carlos &amp; Valentina · 26.12.2026</p>
      </footer>
    </app-container-bg>

    <app-photo-section
      src="assets/images/foto_3.jpeg"
      alt="Foto de los novios"
      [hideBottomDivider]="true"
    />
  </main>
</div>
